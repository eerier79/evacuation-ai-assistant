name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest pytest-cov
      - name: Unit, property and simulation tests with coverage
        run: python -m pytest -q --cov=evacuation --cov-report=term-missing
      - name: Console demo
        run: python main.py
